services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kyc
    ports:
      - "5432:5432"
    volumes:
      - kyc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kyc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kyc-pgdata:
